[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[project]
name = "credit-risk-observability"
version = "0.1.0"
description = "Projeto Pos-tech ML credit-risk-observability"
readme = "README.md"
authors = [
    { name = "Akira", email = "vitorucha96@gmail.com" }
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "joblib==1.6.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "python-dotenv==1.2.4",
    "scikit-learn==1.9.1",
    "ucimlrepo==0.0.7",
]
requires-python = "~=3.12.0"
[project.scripts]
credit-risk-observability = "credit_risk_observability:main"



[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "jupyterlab",
    "notebook",
    "mkdocs",
    "ipython",
    "pip",
]


[tool.ruff]
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["credit_risk_observability"]
force-sort-within-sections = true

